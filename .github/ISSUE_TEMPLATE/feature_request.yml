---
name: Feature request
description: 建议新增规则、reference 或改进技能结构
title: "[feat] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决什么问题
      description: 描述具体场景，不要只写「希望更完善」
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 规则写在哪、怎么检查、影响哪些现有约定
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
    validations:
      required: false
